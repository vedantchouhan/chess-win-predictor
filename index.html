<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Win Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top left, #1a2035 0%, #0d1117 100%);
            color: white; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 650px; width: 100%; position: relative; }
        
        /* Typography */
        .chess-divider { text-align: center; font-size: 1.5rem; opacity: 0.5; margin-bottom: 1rem; letter-spacing: 4px; }
        .hero-title {
            text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 3rem; margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #f0d9b5 0%, #d4a373 50%, #b58863 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-subtitle { text-align: center; color: #8b92a8; margin-bottom: 2rem; font-size: 0.95rem; }
        
        /* Stats */
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
        .stat-tile { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px 8px; text-align: center; transition: all 0.3s; }
        .stat-tile:hover { background: rgba(181, 136, 99, 0.1); border-color: rgba(181, 136, 99, 0.3); transform: translateY(-2px); }
        .stat-num { font-family: 'Space Grotesk', sans-serif; font-size: 1.4rem; font-weight: 700; color: #f0d9b5; }
        .stat-cap { font-size: 0.65rem; color: #8b92a8; text-transform: uppercase; margin-top: 6px; letter-spacing: 1px; font-weight: 600; }
        
        /* Form Card */
        .glass-card {
            background: rgba(20, 25, 40, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        
        .input-row { display: flex; gap: 16px; margin-bottom: 20px; }
        .input-group { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        label { color: #b58863; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input, select {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; color: white; padding: 14px;
            font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: #b58863; box-shadow: 0 0 0 1px #b58863; background: rgba(0, 0, 0, 0.4); }
        select option { background: #131829; color: white; }
        
        /* Autocomplete Suggestion Box */
        .autocomplete-items {
            position: absolute; border: 1px solid rgba(255, 255, 255, 0.1); border-top: none; z-index: 99;
            top: 100%; left: 0; right: 0; background: #1a2035; border-radius: 0 0 10px 10px;
            max-height: 200px; overflow-y: auto; box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            display: none;
        }
        .autocomplete-items div {
            padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem; transition: 0.2s;
        }
        .autocomplete-items div:hover { background: rgba(181, 136, 99, 0.2); color: #f0d9b5; }
        .autocomplete-items div:last-child { border-bottom: none; }
        .autocomplete-active { background: rgba(181, 136, 99, 0.3) !important; color: #f0d9b5; }

        /* Dynamic Rating Diff */
        .rating-diff-badge {
            position: absolute; right: 14px; top: 38px; font-size: 0.8rem; font-weight: 600;
            padding: 4px 8px; border-radius: 6px; display: none;
        }
        .diff-pos { background: rgba(102, 187, 106, 0.15); color: #81c784; }
        .diff-neg { background: rgba(239, 83, 80, 0.15); color: #ef9a9a; }
        .diff-even { background: rgba(255, 255, 255, 0.1); color: #ccc; }

        /* Submit Button */
        button {
            width: 100%; background: linear-gradient(135deg, #b58863 0%, #8b5e34 100%);
            color: white; border: none; border-radius: 12px; padding: 16px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(181, 136, 99, 0.4); }
        button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Results Area */
        .results { display: none; margin-top: 28px; padding-top: 24px; border-top: 1px solid rgba(255, 255, 255, 0.1); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-title { text-align: center; color: #8b92a8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
        
        .bar-container { background: rgba(0, 0, 0, 0.3); border-radius: 8px; height: 32px; margin: 6px 0 18px; position: relative; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bar-fill { height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; font-weight: 700; font-size: 0.9rem; transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); width: 0%; }
        .win-bar { background: linear-gradient(90deg, #2e7d32, #4caf50); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .loss-bar { background: linear-gradient(90deg, #c62828, #ef5350); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        
        .verdict { text-align: center; padding: 18px; border-radius: 12px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; margin-top: 8px; letter-spacing: 0.5px; }

        .footer { text-align: center; margin-top: 2rem; font-size: 0.85rem; color: #6b7280; }
        .footer a { color: #b58863; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="chess-divider">♜ ♞ ♝ ♛ ♚ ♝ ♞ ♜</div>
        <h1 class="hero-title">Chess Win Predictor</h1>
        <p class="hero-subtitle">Production-grade ML engine trained on your 3,827 games · <strong>77.4% Accuracy</strong></p>

        <div class="stat-grid">
            <div class="stat-tile"><div class="stat-num">3,827</div><div class="stat-cap">Games</div></div>
            <div class="stat-tile"><div class="stat-num">77.4%</div><div class="stat-cap">Accuracy</div></div>
            <div class="stat-tile"><div class="stat-num">1639</div><div class="stat-cap">Peak Elo</div></div>
            <div class="stat-tile"><div class="stat-num">51.6%</div><div class="stat-cap">Win Rate</div></div>
        </div>

        <div class="glass-card">
            <form id="predictForm" autocomplete="off">
                <div class="input-row">
                    <div class="input-group">
                        <label>Your Rating</label>
                        <input type="number" id="our_rating" value="1152" required min="100" max="3000">
                    </div>
                    <div class="input-group">
                        <label>Opponent Rating</label>
                        <input type="number" id="opp_rating" value="1000" required min="100" max="3000">
                        <div id="ratingDiff" class="rating-diff-badge"></div>
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label>Your Color</label>
                        <select id="color">
                            <option value="White">White</option>
                            <option value="Black">Black</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Time Control</label>
                        <select id="time_class">
                            <option value="Rapid">Rapid</option>
                            <option value="Blitz">Blitz</option>
                            <option value="Bullet">Bullet</option>
                            <option value="Daily">Daily</option>
                        </select>
                    </div>
                </div>
                <div class="input-group" style="margin-bottom: 10px;">
                    <label>Opening</label>
                    <input type="text" id="opening" placeholder="Type an opening... (e.g., Sicilian)" value="Sicilian">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>
                <button type="submit" id="submitBtn">Analyze Matchup</button>
            </form>

            <div class="results" id="resultsArea">
                <div class="result-title">Probability Forecast</div>
                
                <div style="display: flex; justify-content: space-between; color: #8b92a8; font-size: 0.85rem; font-weight: 600; margin-bottom: -4px;">
                    <span>Win</span>
                    <span id="winText">0%</span>
                </div>
                <div class="bar-container"><div class="bar-fill win-bar" id="winBar"></div></div>
                
                <div style="display: flex; justify-content: space-between; color: #8b92a8; font-size: 0.85rem; font-weight: 600; margin-bottom: -4px;">
                    <span>Loss</span>
                    <span id="lossText">0%</span>
                </div>
                <div class="bar-container"><div class="bar-fill loss-bar" id="lossBar"></div></div>

                <div id="verdictBox" class="verdict"></div>
            </div>
        </div>

        <div class="footer">
            Built by <a href="https://github.com/vedantchouhan" target="_blank">Vedant Chouhan</a> · 
            <a href="https://github.com/vedantchouhan/chess-win-predictor" target="_blank">View Architecture</a>
        </div>
    </div>

    <script>
        const API_URL = "https://chess-win-api.onrender.com";
        let validOpenings = [];

        // 1. Fetch available openings on load
        async function fetchOpenings() {
            try {
                const res = await fetch(`${API_URL}/openings`);
                const data = await res.json();
                validOpenings = data.openings;
            } catch (err) {
                console.warn("Could not load openings from API. Backend might be down.");
                // Fallback list just in case
                validOpenings = ["Sicilian", "French", "Queens", "Kings", "Caro", "English", "Italian", "Ruy", "Slav", "Caro-kann"];
            }
        }
        fetchOpenings();

        // 2. Dynamic Rating Diff Calculator
        const ourRatingInput = document.getElementById('our_rating');
        const oppRatingInput = document.getElementById('opp_rating');
        const diffBadge = document.getElementById('ratingDiff');

        function updateDiff() {
            const our = parseInt(ourRatingInput.value) || 0;
            const opp = parseInt(oppRatingInput.value) || 0;
            const diff = our - opp;
            
            diffBadge.style.display = 'block';
            if (diff > 0) {
                diffBadge.textContent = `+${diff}`;
                diffBadge.className = 'rating-diff-badge diff-pos';
            } else if (diff < 0) {
                diffBadge.textContent = `${diff}`;
                diffBadge.className = 'rating-diff-badge diff-neg';
            } else {
                diffBadge.textContent = `Even`;
                diffBadge.className = 'rating-diff-badge diff-even';
            }
        }
        ourRatingInput.addEventListener('input', updateDiff);
        oppRatingInput.addEventListener('input', updateDiff);
        updateDiff(); // Initial call

        // 3. Autocomplete Logic
        const openingInput = document.getElementById("opening");
        const listNode = document.getElementById("autocomplete-list");
        let currentFocus = -1;

        openingInput.addEventListener("input", function() {
            let val = this.value;
            listNode.innerHTML = "";
            if (!val) { listNode.style.display = "none"; return false; }
            listNode.style.display = "block";
            
            let count = 0;
            for (let i = 0; i < validOpenings.length; i++) {
                if (validOpenings[i].substr(0, val.length).toUpperCase() == val.toUpperCase()) {
                    let item = document.createElement("div");
                    item.innerHTML = "<strong>" + validOpenings[i].substr(0, val.length) + "</strong>";
                    item.innerHTML += validOpenings[i].substr(val.length);
                    item.innerHTML += "<input type='hidden' value='" + validOpenings[i] + "'>";
                    item.addEventListener("click", function() {
                        openingInput.value = this.getElementsByTagName("input")[0].value;
                        listNode.style.display = "none";
                        listNode.innerHTML = "";
                    });
                    listNode.appendChild(item);
                    count++;
                    if(count >= 8) break; // Limit suggestions to 8
                }
            }
        });

        openingInput.addEventListener("keydown", function(e) {
            let items = listNode.getElementsByTagName("div");
            if (e.keyCode == 40) { // DOWN
                currentFocus++;
                addActive(items);
            } else if (e.keyCode == 38) { // UP
                currentFocus--;
                addActive(items);
            } else if (e.keyCode == 13) { // ENTER
                e.preventDefault();
                if (currentFocus > -1 && items[currentFocus]) {
                    items[currentFocus].click();
                }
            }
        });

        function addActive(x) {
            if (!x) return false;
            removeActive(x);
            if (currentFocus >= x.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (x.length - 1);
            x[currentFocus].classList.add("autocomplete-active");
            x[currentFocus].scrollIntoView({ block: "nearest" });
        }
        function removeActive(x) {
            for (let i = 0; i < x.length; i++) {
                x[i].classList.remove("autocomplete-active");
            }
        }
        document.addEventListener("click", function(e) {
            if (e.target !== openingInput) {
                listNode.style.display = "none";
                listNode.innerHTML = "";
            }
        });

        // 4. Form Submission
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing Inference...";
            btn.disabled = true;

            const payload = {
                our_rating: parseInt(ourRatingInput.value),
                opp_rating: parseInt(oppRatingInput.value),
                color: document.getElementById('color').value,
                time_class: document.getElementById('time_class').value,
                opening: openingInput.value
            };

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(!response.ok) throw new Error("API Error");
                const data = await response.json();
                
                const resultsArea = document.getElementById('resultsArea');
                resultsArea.style.display = 'block';
                
                // Reset bars for animation
                document.getElementById('winBar').style.width = '0%';
                document.getElementById('lossBar').style.width = '0%';
                
                // Trigger animation
                setTimeout(() => {
                    document.getElementById('winBar').style.width = data.win_prob + '%';
                    document.getElementById('winText').innerText = data.win_prob + '%';
                    
                    document.getElementById('lossBar').style.width = data.loss_prob + '%';
                    document.getElementById('lossText').innerText = data.loss_prob + '%';
                }, 50);

                // Set Verdict
                const vBox = document.getElementById('verdictBox');
                if (data.win_prob >= 60) {
                    vBox.innerHTML = '♔ Favorable Matchup';
                    vBox.style.background = 'rgba(102, 187, 106, 0.1)';
                    vBox.style.color = '#81c784';
                    vBox.style.border = '1px solid rgba(102, 187, 106, 0.3)';
                } else if (data.win_prob > 40) {
                    vBox.innerHTML = '♞ Highly Contested (Coin Toss)';
                    vBox.style.background = 'rgba(255, 213, 79, 0.1)';
                    vBox.style.color = '#ffd54f';
                    vBox.style.border = '1px solid rgba(255, 213, 79, 0.3)';
                } else {
                    vBox.innerHTML = '♚ Uphill Battle';
                    vBox.style.background = 'rgba(239, 83, 80, 0.1)';
                    vBox.style.color = '#ef9a9a';
                    vBox.style.border = '1px solid rgba(239, 83, 80, 0.3)';
                }
                
                // Scroll to results smoothly
                setTimeout(() => {
                    resultsArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            } catch (error) {
                alert("Cannot connect to backend. Please ensure uvicorn main:app --reload is running.");
            } finally {
                btn.innerText = "Analyze Matchup";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
